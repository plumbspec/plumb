[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "plumb.BASE_VERSION"}

[project]
name = "plumbspec"
# Read from `plumb.BASE_VERSION`, never typed here. A version restated in a second file is a second
# fact, and the two drift silently because nothing compares them — this one sat at 0.5.0rc5 against
# a base of 0.5.0, so a `pip install` and the zipapp reported different versions of one build.
dynamic = ["version"]
description = "Proof that a story is done — verified, not asserted"
license = "Apache-2.0"
# The same floor the adapter declares, so a project needs ONE Python rather than one for its tests
# and a newer one for the tool that watches them. It was 3.11 while the tracer read
# `code.co_qualname` to name a frame and `config` read `tomllib`; a frame is now named from source
# where the runtime cannot report one, and the parser rides inside the artifact (`plumb._vendor`).
# `sys.addaudithook` (3.8+) and `Path.is_relative_to` (3.9+) sit below this.
requires-python = ">=3.9"
dependencies = []

# What the suite needs, and deliberately not what the tool needs — `dependencies = []` above is a
# runtime claim and stays exactly true, which is what makes a single-file zipapp viable at all.
# This is how a machine that did not grow this developer's environment reproduces the run. Until
# there was a machine like that, it was written down nowhere: the first cold run failed on `No
# module named pytest`, having passed here for months.
[project.optional-dependencies]
# `>=8` rather than `>=9`: pytest 9 does not reach 3.9, so pinning it made
# `pip install plumbspec[dev]` unsatisfiable on the floor this project declares one line above.
dev = ["pytest>=8"]

# The CLI command is `plumb`, split from the `plumbspec` package.
[project.scripts]
plumb = "plumb.cli:main"
plumb-series-holder = "plumb.series_holder:main"

# The first module, mounted through the same public mechanism a contributed one uses (`mod4-ur1`).
# `plumb.cli` names none of its verbs: delete this entry and `plumb series` leaves the tool without
# a line of the core changing, which is the whole of what the mount is for.
#
# Declared by this distribution rather than shipped as a second one, so a `pip install plumbspec`
# still has `plumb series` and nothing is removed from anybody in this release. The consequence is
# real and belongs here: a module is only discoverable where its DISTRIBUTION is installed, so a
# source checkout or a zipapp sees no modules at all until one is.
[project.entry-points."plumb.modules"]
series = "plumb_series:DECLARATION"

[tool.setuptools.packages.find]
where = ["src"]

# The vendored parser's licence travels with the code it licenses. `packages.find` collects
# modules and nothing else, so an MIT notice beside them is left out of the wheel while the
# code it covers ships — the one file whose absence is a licence fault rather than a missing
# convenience. The zipapp carries the whole directory and was never short of it, which is how
# this stayed invisible.
[tool.setuptools.package-data]
"plumb._vendor.tomli" = ["LICENSE", "README.md"]

# The production surface Plumb declares about itself lives in `plumb.toml`, beside this file —
# one home, read by the core for every language, because a Java project has no pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["spec", "tests"]
pythonpath = ["spec", "src", "."]
markers = [
    "proves(id, depth, ref): an implementation test citing the gold-spec story it proves, at a depth — e.g. @pytest.mark.proves('dev07-4-2', depth='wiring'). `ref` is optional and is the consumer's own external key (dev07-3-1); Plumb never mints or parses it.",
]
