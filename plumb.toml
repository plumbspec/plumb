# What this project declares about itself — one file, read by the core for every language.
adapter = "python"

# There is deliberately no `stories` line. A feed is a second list mirroring a first, and it
# desynchronizes the moment the first moves — so nothing here enumerates what this project claims.
# The board covers the subjects our tests cite, and says so on every run. `spec/` remains the home
# of what we are building; it is simply not an input to the tool.

# Where this project's own history goes, and what it calls it. `dev07-6-1` — Plumb traces itself, and a
# capability its own board does not use is one nobody here is exercising.
#
# Both are configuration and neither is a secret, which is why they are in the file a
# reviewer reads rather than in a secret store.
#
# `endpoint` is the SERIES receiver and is deliberately unset: an address that stops answering
# queues silently, so a stale one costs nothing until somebody looks. Unset it is, until there is a
# receiver to point at.
subject  = "plumb"

# Where this project's session handoff lives, and which trees a session spans (`dev03`). Both are
# policy and are declared rather than assumed: the cursor is kept outside this tree
# because it carries what is next and *why*, which is operational rather than public, and a session
# here routinely touches more than this one — a fix and the note describing how to cut it land
# together.
#
# `dev07-6-1` is the reason this is worth a word rather than left silent. The loop shipped and this
# project was not running it against its own cursor: `plumb session start` read `.plumb/` and
# honestly reported no cursor while the real one sat outside it, so the
# tool's own dogfooding was of a file nobody keeps.
#
# The path stays at the default HERE and is pointed elsewhere per machine. Where an operator keeps
# their cursor is a property of their machine, not of this project, and a tracked value would put
# one person's directory layout into every checkout.
cursor = ".plumb/next-session.txt"
repos  = ["."]

# Deliberately the console scripts and nothing else: an entry point is where the *wired system*
# begins, and every other public function here is reached through one of these or is not wired at
# all — which is precisely what grounding is for finding out (dev07-1-3).
production   = ["src/plumb"]
# `plumb.receiver:main` stood here and there is no `plumb.receiver` — the holder is
# `plumb.series_holder`, and `pyproject.toml` has named it that all along. A declared entry
# point into a module that does not exist grounds nothing and reports nothing: the run
# simply never reaches it, and every story behind it reads not-wired for a reason no
# message names. This project was carrying that on its own board.
entry_points = ["plumb.cli:main", "plumb.series_holder:main"]

# Off because it is slow, not because it is optional (dev07-2-2). `plumb board --mutation` turns it on
# for a run; see docs/what-to-expect.md for what a full pass costs.
mutation = false

# Which subjects are proved by inspection rather than by running the wired system (`dev07-4-2`). A
# property table, never a list: silence means behavioral, so an entry for an id nothing cites is
# inert rather than a phantom row on a board, and this file still enumerates nothing.
#
# It is here because the tool reads no spec, executing or otherwise (`dev00-1-2-u1`, closed 2026-08-06).
# A Python spec collected by the run could hand this over and a Java one never could, so taking it
# from an executing spec made the archetype mean one thing per language and left `plumb.toml` a
# second home for the same fact. One home, and the same one for every adapter.
[archetypes]
"dev07-4-3"   = "structural"
"dev07-4-1"  = "structural"
