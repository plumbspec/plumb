# The whole declaration, in one file the core reads for every language.
adapter = "dotnet"

# Where the wired system begins (dev07-1-3), as Namespace.Type.Method.
entry_points = ["Sample.App.HandleRequest", "Sample.App.Shapes", "Sample.App.Echo",
                "Sample.App.Record", "Sample.App.FailingRequest", "Sample.App.HandleAsync"]
production   = ["App"]                        # the assemblies that are production code

[archetypes]
"APP-4" = "structural"

[dotnet]
# The test project's build output, as `dotnet build` left it. Plumb runs a copy and never writes here.
tests = "sample/Tests/bin/Debug/net6.0/Tests.dll"
